<style>
        body {
            background-color: #f1f7f4; /* Custom soft light green background */
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 66, 47, 0.08);
        }

<body class="min-h-screen flex items-center justify-center p-4">
<!-- Login Container -->
<main class="w-full max-w-[440px] animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Logo Area -->
<div class="flex flex-col items-center mb-8">
<div class="bg-white p-4 rounded-full shadow-sm mb-4 border border-outline-variant/30">
<img alt="Logo UIN Sunan Kalijaga" class="h-16 w-auto object-contain" data-alt="A professional high-resolution logo of UIN Sunan Kalijaga university featuring its distinctive geometric emblem and Indonesian academic heraldry. The logo is set against a clean white background with soft ambient lighting, emphasizing the institution's heritage of science and technology within an Islamic framework. The visual style is crisp and corporate, suitable for a prestigious educational portal." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBrbr_o4suvKE6OTPx5ZJ-CAFMIR36VvzZX_9evEIM2btfbK2s9_u45SdlAj9lHw2Za2QHeZdC8JLmODA_sAkGfsnfUH7X2HnywUcAPkrKA_io08nEBDAW7YR4_x__5VCTkMD_tGnYDhL_10zFkZ9mIT2svRB6wQM0YhZG09YZOWuS9SGMw6vZb67njtaOJTMGooSB-we_tsU4M4AdF26J8Rx_KXGwjDkQHVhokPxtgp8XwUZK1DDL8v8JOXGeGydHtXDtD79EKu75N"/>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Masuk ke SiaPP</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 text-center">Pusat Pengembangan Karir dan Kewirausahaan FST</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest login-card rounded-xl p-8 md:p-10">
<form class="space-y-6" id="loginForm">
<!-- Username Input -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="username">Username / NIM / NIP</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] group-focus-within:text-primary transition-colors">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-body-md text-on-surface placeholder:text-outline/50" id="username" name="username" placeholder="Masukkan identitas Anda" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant block" for="password">Password</label>
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors" href="#">Lupa Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-body-md text-on-surface placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors p-1 flex items-center" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-2 px-1">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer select-none" for="remember">Ingat Saya</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-container text-white font-title-md py-4 rounded-lg shadow-sm active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" type="submit">
<span>Masuk</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">login</span>
</button>
</form>
</div>
<!-- Back Link -->
<div class="mt-8 text-center">
<a class="inline-flex items-center gap-2 font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="/">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
<span>Kembali ke Beranda</span>
</a>
</div>
</main>
<!-- Background Decorative Elements -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-24 -right-24 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute -bottom-24 -left-24 w-96 h-96 bg-secondary/5 rounded-full blur-3xl"></div>
</div>
<script>
        // Password Visibility Toggle
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');
        const eyeIcon = document.querySelector('#eyeIcon');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Form Submit Simulation
        const loginForm = document.querySelector('#loginForm');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = loginForm.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin material-symbols-outlined">progress_activity</span> <span>Memproses...</span>`;
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                alert('Sistem sedang dalam pengembangan. Silakan coba lagi nanti.');
            }, 1500);
        });
    </script>
</body></html>
